<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigantic 3D Galaxy to Heart - Hyper Speed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #010003;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }

        canvas {
            display: block;
        }

        #instruction {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: blink 1s infinite;
            z-index: 10;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="instruction">CLICK TO TRANSFORM</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const particles = [];
        // Tăng lên 18,000 hạt để khi phóng to thiên hà không bị thưa thớt
        const particleCount = 18000; 
        let isHeart = false; 

        // CHỈNH SỬA: Tăng tiêu cự focalLength lên 650 giúp kéo góc nhìn camera lại gần đĩa bụi sao hơn (tạo cảm giác to lớn hơn)
        const focalLength = 650;

        class Particle {
            constructor() {
                // --- Trạng thái 1: TỌA ĐỘ DẢI NGÂN HÀ BAN ĐẦU ---
                const arms = 2; 
                const armIndex = Math.floor(Math.random() * arms);
                // Mở rộng bán kính dải thiên hà (từ 3.5 lên 4.5)
                const distance = Math.pow(Math.random(), 1.8) * 4.5; 
                const angle = distance * 1.8 + (armIndex * (Math.PI * 2 / arms)) + (Math.random() - 0.5) * 0.35;
                const thickness = (4.5 - distance) * 0.15; 
                
                // CHỈNH SỬA: Tăng tỉ lệ đĩa ngân hà ban đầu lớn hơn đáng kể
                const galaxyScale = width < 600 ? 180 : 380;
                this.x3D = Math.cos(angle) * distance * galaxyScale;
                this.y3D = (Math.random() - 0.5) * thickness * galaxyScale;
                this.z3D = Math.sin(angle) * distance * galaxyScale;

                this.orbitSpeed = Math.random() * 0.015 + 0.01;
                this.orbitRadius = Math.sqrt(this.x3D * this.x3D + this.z3D * this.z3D);
                this.orbitAngle = Math.atan2(this.z3D, this.x3D);

                // --- Trạng thái 2: TOÁN HỌC TRÁI TIM MỤC TIÊU ---
                let found = false;
                let hx, hy, hz;
                
                while (!found) {
                    hx = (Math.random() - 0.5) * 3; 
                    hy = (Math.random() - 0.5) * 3; 
                    hz = (Math.random() - 0.5) * 3; 
                    
                    let a = hx*hx + 2.25*hy*hy + hz*hz - 1;
                    let val = a*a*a - hx*hx*hz*hz*hz - 0.1125*hy*hy*hz*hz*hz;
                    
                    if (val <= 0 && val >= -0.2) {
                        found = true;
                    }
                }
                
                this.baseX = hx;
                this.baseY = -hz; 
                this.baseZ = hy;

                // Giữ hạt kích thước mịn lấp lánh
                this.size = Math.random() * 1.4 + 0.2; 
                
                // Bảng màu tinh vân rực rỡ
                const colors = ['#ff2a6d', '#ff71ce', '#05ffa1', '#00f5ff', '#ffffff', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                this.screenX = 0;
                this.screenY = 0;
                this.screenScale = 1;
                this.depth = 0; 
            }

            update(pulse, currentAngle) {
                if (isHeart) {
                    // CHỈNH SỬA: Tăng kích thước phom Trái Tim khổng lồ (Từ 280 lên 420 trên máy tính)
                    const baseScale = width < 600 ? 200 : 420;
                    const scale = baseScale * pulse;

                    const targetX = this.baseX * scale;
                    const targetY = this.baseY * scale;
                    const targetZ = this.baseZ * scale;

                    this.x3D += (targetX - this.x3D) * 0.22;
                    this.y3D += (targetY - this.y3D) * 0.22;
                    this.z3D += (targetZ - this.z3D) * 0.22;
                } else {
                    // TRẠNG THÁI NGÂN HÀ: Xoay quanh lõi trung tâm
                    this.orbitAngle += this.orbitSpeed;
                    const targetX = Math.cos(this.orbitAngle) * this.orbitRadius;
                    const targetZ = Math.sin(this.orbitAngle) * this.orbitRadius;
                    
                    this.x3D += (targetX - this.x3D) * 0.1;
                    this.z3D += (targetZ - this.z3D) * 0.1;
                }

                // --- TOÁN HỌC XOAY 3D ---
                let cosA = Math.cos(currentAngle);
                let sinA = Math.sin(currentAngle);
                let rotX = this.x3D * cosA - this.z3D * sinA;
                let rotZ = this.x3D * sinA + this.z3D * cosA;
                
                let tilt = 0.55; // Độ nghiêng đĩa sao nhìn có độ dày 3D sâu thẳm
                let cosT = Math.cos(tilt);
                let sinT = Math.sin(tilt);
                let rotY = this.y3D * cosT - rotZ * sinT;
                let finalZ = this.y3D * sinT + rotZ * cosT;

                this.depth = finalZ;

                // --- PHỐI CẢNH CHIỀU SÂU ---
                let offsetZ = 450; 
                this.screenScale = focalLength / (focalLength + finalZ + offsetZ);
                
                if(this.screenScale < 0) this.screenScale = 0.001; 

                this.screenX = width / 2 + rotX * this.screenScale;
                this.screenY = height / 2 + rotY * this.screenScale;
            }

            draw() {
                ctx.globalAlpha = Math.min(1, Math.max(0.1, this.screenScale * 1.1));
                ctx.fillStyle = this.color;
                ctx.beginPath();
                let drawSize = this.size * this.screenScale;
                ctx.arc(this.screenX, this.screenY, Math.max(0.05, drawSize), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        let time = 0; 
        let rotationAngle = 0; 

        function animate() {
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = 'rgba(2, 0, 5, 0.14)'; // Tạo vệt quét mờ mượt mà
            ctx.fillRect(0, 0, width, height);

            // GIỮ NGUYÊN TỐC ĐỘ SIÊU NHANH
            time += 0.12;           
            rotationAngle += 0.035; 
            
            let pulse = 1 + Math.pow(Math.abs(Math.sin(time)), 6) * 0.07;

            particles.forEach(p => p.update(pulse, rotationAngle));

            particles.sort((a, b) => b.depth - a.depth);

            particles.forEach(p => p.draw());

            requestAnimationFrame(animate);
        }

        animate();

        // Các bộ lắng nghe tương tác chạm/click để co bóp chuyển hình
        window.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D' || e.key === ' ') {
                isHeart = !isHeart;
            }
        });

        window.addEventListener('touchstart', () => {
            isHeart = !isHeart;
        });

        window.addEventListener('click', () => {
            isHeart = !isHeart;
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
